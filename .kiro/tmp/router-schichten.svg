<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <rect x="0" y="0" width="700" height="380" fill="#1A1A1A"/>
  <text x="350" y="30" fill="#E8E8E8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">ROUTER – SCHICHTENVERARBEITUNG</text>
  <rect x="20" y="50" width="660" height="315" fill="#2D2D2D" stroke="#4A9EFF" rx="8" stroke-width="2"/>
  <text x="50" y="75" fill="#888888" font-family="monospace" font-size="11">Schicht</text>
  <text x="200" y="75" fill="#888888" font-family="monospace" font-size="11">Verarbeitung</text>
  <text x="480" y="75" fill="#888888" font-family="monospace" font-size="11">Status</text>
  <line x1="35" y1="85" x2="665" y2="85" stroke="#444444" stroke-width="1"/>
  <rect x="35" y="95" width="630" height="40" fill="#4A4A4A" stroke="#444444" rx="4" stroke-width="1"/>
  <text x="50" y="120" fill="#CCCCCC" font-family="monospace" font-size="13" font-weight="bold">Anwendung</text>
  <text x="200" y="120" fill="#666666" font-family="monospace" font-size="12">░░░░░░░░░░░░░░░░░░░░</text>
  <text x="480" y="120" fill="#888888" font-family="monospace" font-size="12">Nicht verarbeitet</text>
  <rect x="35" y="140" width="630" height="40" fill="#4A4A4A" stroke="#444444" rx="4" stroke-width="1"/>
  <text x="50" y="165" fill="#CCCCCC" font-family="monospace" font-size="13" font-weight="bold">Transport</text>
  <text x="200" y="165" fill="#666666" font-family="monospace" font-size="12">░░░░░░░░░░░░░░░░░░░░</text>
  <text x="480" y="165" fill="#888888" font-family="monospace" font-size="12">Nicht verarbeitet</text>
  <rect x="35" y="185" width="630" height="40" fill="#1E3A5F" stroke="#444444" rx="4" stroke-width="1"/>
  <text x="50" y="210" fill="#CCCCCC" font-family="monospace" font-size="13" font-weight="bold">Internet</text>
  <text x="200" y="210" fill="#4ADE80" font-family="monospace" font-size="12">✓ Routing-Entscheidung</text>
  <text x="480" y="210" fill="#4ADE80" font-family="monospace" font-size="12">Layer 3</text>
  <rect x="35" y="230" width="630" height="55" fill="#1E5631" stroke="#444444" rx="4" stroke-width="1"/>
  <text x="50" y="262" fill="#CCCCCC" font-family="monospace" font-size="13" font-weight="bold">Netzzugang</text>
  <text x="200" y="248" fill="#4ADE80" font-family="monospace" font-size="12">✓ MAC-Adressen ändern</text>
  <text x="200" y="266" fill="#4ADE80" font-family="monospace" font-size="12">✓ Frame neu aufbauen</text>
  <text x="480" y="262" fill="#4ADE80" font-family="monospace" font-size="12">Layer 1-2</text>
  <rect x="35" y="310" width="630" height="45" fill="#2A2A2A" stroke="#FFB347" rx="4" stroke-width="1"/>
  <text x="50" y="328" fill="#FFB347" font-family="monospace" font-size="11" font-weight="bold">Router "sehen" nicht in TCP-Header oder HTTP-Daten!</text>
  <text x="50" y="345" fill="#CCCCCC" font-family="monospace" font-size="10">(Ausnahme: Deep Packet Inspection bei Firewalls)</text>
</svg>
