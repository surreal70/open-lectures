<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <defs>
    <style>
      .title { font: bold 18px sans-serif; fill: #1a1a1a; }
      .section-title { font: bold 14px sans-serif; fill: #fff; }
      .label { font: 12px sans-serif; fill: #333; }
      .small { font: 11px sans-serif; fill: #444; }
      .tiny { font: 10px sans-serif; fill: #555; }
      .outer-box { fill: #f8f9fa; stroke: #555; stroke-width: 3; }
      .frontend-header { fill: #3498db; }
      .frontend-box { fill: #e8f4fc; stroke: #3498db; stroke-width: 2; }
      .exec-header { fill: #e74c3c; }
      .exec-box { fill: #fdecea; stroke: #e74c3c; stroke-width: 2; }
      .ls-header { fill: #27ae60; }
      .ls-box { fill: #d5f5e3; stroke: #27ae60; stroke-width: 2; }
      .component { fill: #fff; stroke: #888; stroke-width: 1.5; }
      .unit { fill: #ddd; stroke: #666; stroke-width: 1; }
      .connector { stroke: #666; stroke-width: 2; fill: none; }
      .arrow { fill: #666; }
    </style>
  </defs>
  
  <!-- Outer frame -->
  <rect x="20" y="20" width="860" height="860" class="outer-box" rx="10"/>
  
  <!-- Title -->
  <text x="450" y="55" text-anchor="middle" class="title">ZEN 3 EINZELNER KERN</text>
  
  <!-- ===== FRONTEND SECTION ===== -->
  <rect x="50" y="80" width="800" height="280" class="frontend-box" rx="6"/>
  <rect x="50" y="80" width="800" height="30" class="frontend-header" rx="6"/>
  <rect x="50" y="100" width="800" height="10" class="frontend-header"/>
  <text x="450" y="100" text-anchor="middle" class="section-title">FRONTEND</text>
  
  <!-- Branch Prediction -->
  <rect x="80" y="120" width="740" height="70" class="component" rx="4"/>
  <text x="100" y="142" class="label" font-weight="bold">Branch Prediction</text>
  <text x="100" y="162" class="small">• TAGE Predictor</text>
  <text x="300" y="162" class="small">• 6.5K BTB Entries</text>
  <text x="500" y="162" class="small">• 512 Indirect Target Array</text>
  
  <!-- L1 I-Cache -->
  <rect x="80" y="200" width="740" height="35" class="component" rx="4"/>
  <text x="450" y="223" text-anchor="middle" class="label">L1 Instruction Cache: 32 KB, 8-Way</text>
  
  <!-- Op Cache -->
  <rect x="80" y="245" width="740" height="50" class="component" rx="4"/>
  <text x="100" y="268" class="label" font-weight="bold">Op Cache: 4K µOps</text>
  <text x="280" y="268" class="small">(Decoded Instruction Cache)</text>
  <text x="100" y="285" class="tiny">Bypass für häufig genutzte Befehlssequenzen</text>
  
  <!-- Decoder -->
  <rect x="80" y="305" width="740" height="45" class="component" rx="4"/>
  <text x="100" y="328" class="label" font-weight="bold">4 Decoder</text>
  <text x="200" y="328" class="small">(bis zu 8 µOps/Takt)</text>
  <text x="450" y="328" class="small">Macro-Op Fusion (CMP+JCC, TEST+JCC)</text>
  
  <!-- Arrow Frontend to Execution -->
  <path d="M450,360 L450,380" class="connector"/>
  <polygon points="450,390 445,380 455,380" class="arrow"/>
  
  <!-- ===== EXECUTION SECTION ===== -->
  <rect x="50" y="400" width="800" height="320" class="exec-box" rx="6"/>
  <rect x="50" y="400" width="800" height="30" class="exec-header" rx="6"/>
  <rect x="50" y="420" width="800" height="10" class="exec-header"/>
  <text x="450" y="420" text-anchor="middle" class="section-title">EXECUTION</text>
  
  <!-- Integer Scheduler -->
  <rect x="80" y="440" width="360" height="170" class="component" rx="4"/>
  <text x="100" y="462" class="label" font-weight="bold">Integer Scheduler</text>
  <text x="100" y="482" class="small">4 × 24 Entries = 96</text>
  
  <!-- ALU units -->
  <g transform="translate(100, 495)">
    <rect x="0" y="0" width="50" height="30" class="unit" rx="3"/>
    <text x="25" y="20" text-anchor="middle" class="tiny">ALU</text>
    <rect x="60" y="0" width="50" height="30" class="unit" rx="3"/>
    <text x="85" y="20" text-anchor="middle" class="tiny">ALU</text>
    <rect x="120" y="0" width="50" height="30" class="unit" rx="3"/>
    <text x="145" y="20" text-anchor="middle" class="tiny">ALU</text>
    <rect x="180" y="0" width="50" height="30" class="unit" rx="3"/>
    <text x="205" y="20" text-anchor="middle" class="tiny">ALU</text>
    <text x="250" y="20" class="tiny">4× Integer ALU</text>
  </g>
  
  <!-- AGU units -->
  <g transform="translate(100, 535)">
    <rect x="0" y="0" width="60" height="30" class="unit" rx="3"/>
    <text x="30" y="20" text-anchor="middle" class="tiny">AGU</text>
    <rect x="70" y="0" width="60" height="30" class="unit" rx="3"/>
    <text x="100" y="20" text-anchor="middle" class="tiny">AGU</text>
    <rect x="140" y="0" width="60" height="30" class="unit" rx="3"/>
    <text x="170" y="20" text-anchor="middle" class="tiny">AGU</text>
    <text x="220" y="20" class="tiny">3× Address Gen</text>
  </g>
  
  <!-- Branch unit -->
  <g transform="translate(100, 575)">
    <rect x="0" y="0" width="70" height="25" class="unit" rx="3"/>
    <text x="35" y="17" text-anchor="middle" class="tiny">Branch</text>
    <text x="90" y="17" class="tiny">1× Branch Unit</text>
  </g>
  
  <!-- FP/SIMD Scheduler -->
  <rect x="460" y="440" width="360" height="170" class="component" rx="4"/>
  <text x="480" y="462" class="label" font-weight="bold">FP / SIMD Scheduler</text>
  <text x="480" y="482" class="small">2 × 32 = 64 Entries</text>
  
  <!-- FMA units -->
  <rect x="480" y="495" width="320" height="55" class="unit" rx="3"/>
  <text x="490" y="515" class="small" font-weight="bold">4× 256-Bit FMA (AVX2)</text>
  <text x="490" y="532" class="tiny">= 2× 256-Bit FP MUL + 2× 256-Bit FP ADD</text>
  <text x="490" y="545" class="tiny">oder 4× 128-Bit</text>
  
  <!-- FP Store -->
  <rect x="480" y="560" width="320" height="30" class="unit" rx="3"/>
  <text x="490" y="580" class="small">2× FP Store (256-Bit)</text>
  
  <!-- Reorder Buffer info -->
  <text x="100" y="640" class="label" font-weight="bold">Reorder Buffer: 256 Entries</text>
  <text x="450" y="640" class="label" font-weight="bold">Retire Width: 8 µOps/Takt</text>
  
  <!-- Arrow Execution to Load/Store -->
  <path d="M450,720 L450,740" class="connector"/>
  <polygon points="450,750 445,740 455,740" class="arrow"/>
  
  <!-- ===== LOAD/STORE SECTION ===== -->
  <rect x="50" y="760" width="800" height="105" class="ls-box" rx="6"/>
  <rect x="50" y="760" width="800" height="30" class="ls-header" rx="6"/>
  <rect x="50" y="780" width="800" height="10" class="ls-header"/>
  <text x="450" y="780" text-anchor="middle" class="section-title">LOAD/STORE</text>
  
  <text x="100" y="815" class="small">L1 Data Cache: 32 KB, 8-Way</text>
  <text x="350" y="815" class="small">Load Queue: 72 Entries</text>
  <text x="550" y="815" class="small">Store Queue: 64 Entries</text>
  <text x="100" y="838" class="small">3 Loads + 2 Stores pro Takt</text>
  <text x="350" y="838" class="small" font-weight="bold">L2 Cache: 512 KB, 8-Way (privat pro Kern)</text>
</svg>
