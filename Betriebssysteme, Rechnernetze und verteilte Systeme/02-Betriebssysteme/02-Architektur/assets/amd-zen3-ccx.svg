<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <style>
      .title { font: bold 18px sans-serif; fill: #1a1a1a; }
      .subtitle { font: 14px sans-serif; fill: #444; }
      .label { font: 12px sans-serif; fill: #333; }
      .small { font: 10px sans-serif; fill: #555; }
      .tiny { font: 9px sans-serif; fill: #666; }
      .core-box { fill: #e8f4fc; stroke: #2980b9; stroke-width: 2; }
      .l3-box { fill: #d5f5e3; stroke: #27ae60; stroke-width: 2; }
      .fabric-box { fill: #fdebd0; stroke: #e67e22; stroke-width: 2; }
      .outer-box { fill: #f8f9fa; stroke: #555; stroke-width: 3; rx: 8; }
      .inner-box { fill: #fff; stroke: #888; stroke-width: 1.5; }
      .connector { stroke: #666; stroke-width: 2; fill: none; }
      .arrow { fill: #666; }
    </style>
  </defs>
  
  <!-- Outer frame -->
  <rect x="20" y="20" width="860" height="610" class="outer-box" rx="10"/>
  
  <!-- Title -->
  <text x="450" y="55" text-anchor="middle" class="title">ZEN 3 CORE COMPLEX (CCX)</text>
  <text x="450" y="78" text-anchor="middle" class="subtitle">(8 Kerne mit Unified L3)</text>
  
  <!-- Cores section background -->
  <rect x="50" y="100" width="800" height="280" class="inner-box" rx="5"/>
  <text x="450" y="125" text-anchor="middle" class="label" font-weight="bold">8 ZEN 3 KERNE</text>
  
  <!-- 8 Core boxes -->
  <g id="cores">
    <!-- Core 0 -->
    <rect x="70" y="140" width="85" height="140" class="core-box" rx="4"/>
    <text x="112" y="160" text-anchor="middle" class="label" font-weight="bold">Core 0</text>
    <text x="112" y="180" text-anchor="middle" class="small">L1 I$</text>
    <text x="112" y="193" text-anchor="middle" class="tiny">32 KB</text>
    <text x="112" y="215" text-anchor="middle" class="small">L1 D$</text>
    <text x="112" y="228" text-anchor="middle" class="tiny">32 KB</text>
    <text x="112" y="250" text-anchor="middle" class="small">L2$</text>
    <text x="112" y="263" text-anchor="middle" class="tiny">512 KB</text>
    
    <!-- Core 1 -->
    <rect x="165" y="140" width="85" height="140" class="core-box" rx="4"/>
    <text x="207" y="160" text-anchor="middle" class="label" font-weight="bold">Core 1</text>
    <text x="207" y="180" text-anchor="middle" class="small">L1 I$</text>
    <text x="207" y="193" text-anchor="middle" class="tiny">32 KB</text>
    <text x="207" y="215" text-anchor="middle" class="small">L1 D$</text>
    <text x="207" y="228" text-anchor="middle" class="tiny">32 KB</text>
    <text x="207" y="250" text-anchor="middle" class="small">L2$</text>
    <text x="207" y="263" text-anchor="middle" class="tiny">512 KB</text>
    
    <!-- Core 2 -->
    <rect x="260" y="140" width="85" height="140" class="core-box" rx="4"/>
    <text x="302" y="160" text-anchor="middle" class="label" font-weight="bold">Core 2</text>
    <text x="302" y="180" text-anchor="middle" class="small">L1 I$</text>
    <text x="302" y="193" text-anchor="middle" class="tiny">32 KB</text>
    <text x="302" y="215" text-anchor="middle" class="small">L1 D$</text>
    <text x="302" y="228" text-anchor="middle" class="tiny">32 KB</text>
    <text x="302" y="250" text-anchor="middle" class="small">L2$</text>
    <text x="302" y="263" text-anchor="middle" class="tiny">512 KB</text>
    
    <!-- Core 3 -->
    <rect x="355" y="140" width="85" height="140" class="core-box" rx="4"/>
    <text x="397" y="160" text-anchor="middle" class="label" font-weight="bold">Core 3</text>
    <text x="397" y="180" text-anchor="middle" class="small">L1 I$</text>
    <text x="397" y="193" text-anchor="middle" class="tiny">32 KB</text>
    <text x="397" y="215" text-anchor="middle" class="small">L1 D$</text>
    <text x="397" y="228" text-anchor="middle" class="tiny">32 KB</text>
    <text x="397" y="250" text-anchor="middle" class="small">L2$</text>
    <text x="397" y="263" text-anchor="middle" class="tiny">512 KB</text>
    
    <!-- Core 4 -->
    <rect x="450" y="140" width="85" height="140" class="core-box" rx="4"/>
    <text x="492" y="160" text-anchor="middle" class="label" font-weight="bold">Core 4</text>
    <text x="492" y="180" text-anchor="middle" class="small">L1 I$</text>
    <text x="492" y="193" text-anchor="middle" class="tiny">32 KB</text>
    <text x="492" y="215" text-anchor="middle" class="small">L1 D$</text>
    <text x="492" y="228" text-anchor="middle" class="tiny">32 KB</text>
    <text x="492" y="250" text-anchor="middle" class="small">L2$</text>
    <text x="492" y="263" text-anchor="middle" class="tiny">512 KB</text>
    
    <!-- Core 5 -->
    <rect x="545" y="140" width="85" height="140" class="core-box" rx="4"/>
    <text x="587" y="160" text-anchor="middle" class="label" font-weight="bold">Core 5</text>
    <text x="587" y="180" text-anchor="middle" class="small">L1 I$</text>
    <text x="587" y="193" text-anchor="middle" class="tiny">32 KB</text>
    <text x="587" y="215" text-anchor="middle" class="small">L1 D$</text>
    <text x="587" y="228" text-anchor="middle" class="tiny">32 KB</text>
    <text x="587" y="250" text-anchor="middle" class="small">L2$</text>
    <text x="587" y="263" text-anchor="middle" class="tiny">512 KB</text>
    
    <!-- Core 6 -->
    <rect x="640" y="140" width="85" height="140" class="core-box" rx="4"/>
    <text x="682" y="160" text-anchor="middle" class="label" font-weight="bold">Core 6</text>
    <text x="682" y="180" text-anchor="middle" class="small">L1 I$</text>
    <text x="682" y="193" text-anchor="middle" class="tiny">32 KB</text>
    <text x="682" y="215" text-anchor="middle" class="small">L1 D$</text>
    <text x="682" y="228" text-anchor="middle" class="tiny">32 KB</text>
    <text x="682" y="250" text-anchor="middle" class="small">L2$</text>
    <text x="682" y="263" text-anchor="middle" class="tiny">512 KB</text>
    
    <!-- Core 7 -->
    <rect x="735" y="140" width="85" height="140" class="core-box" rx="4"/>
    <text x="777" y="160" text-anchor="middle" class="label" font-weight="bold">Core 7</text>
    <text x="777" y="180" text-anchor="middle" class="small">L1 I$</text>
    <text x="777" y="193" text-anchor="middle" class="tiny">32 KB</text>
    <text x="777" y="215" text-anchor="middle" class="small">L1 D$</text>
    <text x="777" y="228" text-anchor="middle" class="tiny">32 KB</text>
    <text x="777" y="250" text-anchor="middle" class="small">L2$</text>
    <text x="777" y="263" text-anchor="middle" class="tiny">512 KB</text>
  </g>
  
  <!-- Connectors from cores to L3 -->
  <path d="M112,280 L112,300 L450,300 L450,320" class="connector"/>
  <path d="M207,280 L207,300" class="connector"/>
  <path d="M302,280 L302,300" class="connector"/>
  <path d="M397,280 L397,300" class="connector"/>
  <path d="M492,280 L492,300" class="connector"/>
  <path d="M587,280 L587,300" class="connector"/>
  <path d="M682,280 L682,300" class="connector"/>
  <path d="M777,280 L777,300 L450,300" class="connector"/>
  <path d="M112,300 L777,300" class="connector"/>
  
  <!-- Arrow to L3 -->
  <polygon points="450,320 445,310 455,310" class="arrow"/>
  
  <!-- L3 Cache -->
  <rect x="100" y="330" width="700" height="120" class="l3-box" rx="6"/>
  <text x="450" y="360" text-anchor="middle" class="label" font-weight="bold">UNIFIED L3 CACHE (32 MB)</text>
  <text x="450" y="385" text-anchor="middle" class="small">Alle 8 Kerne teilen sich den gesamten L3 Cache</text>
  <text x="450" y="405" text-anchor="middle" class="tiny" fill="#666">(Zen 2 hatte 2×4 Kerne mit je 16 MB = nicht unified)</text>
  <text x="450" y="430" text-anchor="middle" class="small">16-Way Set Associative | 64 Byte Cache Lines</text>
  
  <!-- Connector to Infinity Fabric -->
  <path d="M450,450 L450,480" class="connector"/>
  <polygon points="450,490 445,480 455,480" class="arrow"/>
  
  <!-- Infinity Fabric -->
  <rect x="100" y="500" width="700" height="110" class="fabric-box" rx="6"/>
  <text x="450" y="530" text-anchor="middle" class="label" font-weight="bold">INFINITY FABRIC</text>
  <text x="450" y="555" text-anchor="middle" class="small">• Verbindet CCX mit Memory Controller (I/O Die)</text>
  <text x="450" y="575" text-anchor="middle" class="small">• Verbindet mehrere CCDs in Multi-Chiplet Designs</text>
  <text x="450" y="595" text-anchor="middle" class="small">• Skaliert von 1 CCD (8 Kerne) bis 8 CCDs (64 Kerne, EPYC)</text>
</svg>
